<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sohail Studio | Modern Web Development</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background: #0b0c1b;
      color: #ffffff;
      padding-bottom: 40px;
      overflow-x: hidden;
    }

    /* Keyframe Animations Triggered Only On Hover */
    @keyframes hoverFloat {
      0% { transform: translateY(-4px); }
      100% { transform: translateY(-8px); }
    }

    @keyframes waHoverFloat {
      0% { transform: translateY(-4px); }
      100% { transform: translateY(-8px); }
    }

    /* 1. Navbar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 6%;
      background: rgba(15, 16, 38, 0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(0, 242, 254, 0.15);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7928ca, #ff0080);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 800;
      font-size: 1.2rem;
      box-shadow: 0 0 12px rgba(255, 0, 128, 0.4);
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .nav-links a {
      color: #a0aec0;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #00f2fe;
    }

    /* Base Buttons Transitions */
    .btn-hire, .btn-cta, .btn-open, .btn-wa-send, .float-btn {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, background 0.3s ease;
      display: inline-block;
    }

    /* Hire Me Button - Float on Hover */
    .btn-hire {
      background: linear-gradient(90deg, #7928ca, #ff0080);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      box-shadow: 0 4px 12px rgba(255, 0, 128, 0.3);
    }

    .btn-hire:hover {
      animation: hoverFloat 1s infinite ease-in-out alternate;
      box-shadow: 0 8px 22px rgba(255, 0, 128, 0.7);
    }

    /* 2. Hero Section */
    .hero {
      text-align: center;
      padding: 50px 20px 30px;
      max-width: 900px;
      margin: 0 auto;
    }

    .hero-badge {
      display: inline-block;
      background: rgba(121, 40, 202, 0.2);
      border: 1px solid rgba(121, 40, 202, 0.5);
      color: #00f2fe;
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: 2.3rem;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .hero h1 span {
      background: linear-gradient(90deg, #7928ca, #ff0080);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-tagline {
      color: #a0aec0;
      font-size: 1rem;
      margin-bottom: 25px;
    }

    .hero-cta-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .btn-cta {
      padding: 12px 22px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
    }

    /* Primary CTA Float on Hover */
    .btn-primary {
      background: linear-gradient(90deg, #7928ca, #ff0080);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 0, 128, 0.3);
    }

    .btn-primary:hover {
      animation: hoverFloat 1.2s infinite ease-in-out alternate;
      box-shadow: 0 10px 28px rgba(255, 0, 128, 0.75);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-secondary:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(0, 242, 254, 0.5);
      box-shadow: 0 8px 20px rgba(0, 242, 254, 0.3);
    }

    .social-proof {
      color: #ffd700;
      font-size: 0.85rem;
      margin-bottom: 35px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .stat-card {
      background: rgba(22, 24, 56, 0.6);
      border: 1px solid rgba(0, 242, 254, 0.1);
      padding: 15px;
      border-radius: 14px;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 242, 254, 0.4);
    }

    .stat-card h3 {
      color: #00f2fe;
      font-size: 1.3rem;
    }

    .stat-card p {
      color: #a0aec0;
      font-size: 0.75rem;
    }

    .section-title {
      text-align: center;
      font-size: 1.6rem;
      margin: 50px 0 25px;
      color: #00f2fe;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Demo Cards */
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 0 5%;
    }

    .demo-card {
      background: rgba(22, 24, 56, 0.7);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(0, 242, 254, 0.15);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .demo-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 0, 128, 0.5);
    }

    .card-banner {
      height: 150px;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .card-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(11, 12, 27, 0.85);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      color: #00f2fe;
      border: 1px solid rgba(0, 242, 254, 0.3);
    }

    .card-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-content h3 {
      font-size: 1.15rem;
      margin-bottom: 6px;
    }

    .card-content p {
      font-size: 0.82rem;
      color: #a0aec0;
      margin-bottom: 14px;
    }

    /* Open Website Button Float On Hover */
    .btn-open {
      display: block;
      text-align: center;
      padding: 10px;
      background: linear-gradient(90deg, #7928ca, #ff0080);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 10px;
      font-size: 0.85rem;
      box-shadow: 0 4px 12px rgba(255, 0, 128, 0.3);
    }

    .btn-open:hover {
      animation: hoverFloat 1s infinite ease-in-out alternate;
      box-shadow: 0 8px 22px rgba(255, 0, 128, 0.7);
    }

    /* WhatsApp Form Button Float On Hover */
    .btn-wa-send {
      width: 100%;
      padding: 12px;
      background: #25d366;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
    }

    .btn-wa-send:hover {
      animation: waHoverFloat 1s infinite ease-in-out alternate;
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.7);
    }

    /* Floating Navigation Icons On Hover */
    .floating-nav {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 1000;
    }

    .float-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-decoration: none;
    }

    .btn-call { background: #7928ca; }
    .btn-call:hover {
      animation: hoverFloat 1s infinite ease-in-out alternate;
      box-shadow: 0 8px 22px rgba(121, 40, 202, 0.8);
    }

    .btn-wa { background: #25d366; }
    .btn-wa:hover {
      animation: waHoverFloat 1s infinite ease-in-out alternate;
      box-shadow: 0 8px 22px rgba(37, 211, 102, 0.8);
    }

    .float-btn svg { width: 26px; height: 26px; fill: #fff; }
  </style>
</head>
<body>
  <!-- [Remaining HTML elements remain same] -->
</body>
</html>
